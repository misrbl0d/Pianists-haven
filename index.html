.piano-container {
  display: flex;
  justify-content: center;
  width: 90vw;
  height: 57vh;
  border: 10px solid #000634;
  border-radius: 2em;
  margin: auto;
  position: relative;
  padding: 1em;
  margin-top: 15rem;
}

.key {
  width: 2.5rem;
  height: 10rem;
  border-radius: 0 0 4px 4px;
  box-shadow: 2px 2px 10px 0px #ccc;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  cursor: pointer;
}

.white-key {
  border: 3px solid #010425;
  background-color: #fff;
  transition: 0.2s all;
}

.white-active,
.white-key:hover {
  background-color: rgb(223, 198, 198);
  border-bottom: none;
  transform: rotate3d(1, 0, 0, 20deg);
}

.black-key {
  background: rgb(36, 32, 30);
  z-index: 1;
  background: linear-gradient(
    180deg,
    rgba(36, 32, 30, 1) 26%,
    rgb(173, 111, 124) 86%
  );
  height: 7rem;
  width: 1.5rem;
  position: absolute;
  top: 20px;
  transition: 0.2s all;

}

  left: 183px;
